<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speak the Sentence!</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#3498db; --primary-dark:#2980b9;
  --good:#27ae60;    --bad:#e74c3c;
  --font:"Poppins",sans-serif;
}
/* ---- global ---- */
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#eaf3ff;padding:4vw;
}
/* ---- big rectangle ---- */
.box{
  width:100%;max-width:1000px;
  background:#fff;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);
  padding:32px;display:flex;gap:32px;
  max-height:90vh;overflow-y:auto;  /* allow scroll within the card */
  flex-wrap:wrap;
}
@media(max-width:768px){.box{flex-direction:column;padding:24px}}

/* ---- left column ---- */
#left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#image{font-size:clamp(90px,18vw,150px);margin-bottom:24px;width:100%;text-align:center;max-height:150px}
#sentence{
  width:100%;background:#f9faff;border-radius:12px;padding:18px 22px;
  font-size:clamp(1.3rem,3.5vw,1.6rem);font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px;text-align:center;
}

/* ---- right column ---- */
#right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
#countdown{font-size:clamp(2.2rem,6vw,3.2rem);font-weight:700;color:var(--bad);min-height:52px}
#output{font-size:clamp(1rem,2.5vw,1.15rem);margin-top:24px}
#result{font-size:clamp(1.2rem,3vw,1.4rem);font-weight:700;margin-top:18px}
.good{color:var(--good)} .bad{color:var(--bad)}
#score{font-size:clamp(1.1rem,3vw,1.3rem);font-weight:600;margin-top:24px}

/* button row and spacing */
#btnRow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
button{
  font-size:clamp(.9rem,2.4vw,1rem);padding:14px 26px;border:none;border-radius:10px;
  background:var(--primary);color:#fff;cursor:pointer;transition:.25s;
  box-shadow:0 3px 12px rgba(0,0,0,.12)
}
button:hover{background:var(--primary-dark);transform:translateY(-2px)}
button:disabled{background:#a9c5df;transform:none;cursor:not-allowed}

/* make columns stack on narrow phones */
@media(max-width:768px){
  #left,#right{width:100%}
}
</style>
</head>
<body>

<div class="box">
  <!-- LEFT SIDE -->
  <div id="left">
    <h1>🎤Speak the Sentence</h1>
    <h2>Developed by Uplers</h2>

    <div id="image">🍎</div>
    <p id="sentence">Loading…</p>

    <div id="btnRow">
      <button id="startBtn" onclick="startCountdown()">🎤 Start Speaking</button>
      <button onclick="nextSentence()">🔄 New Sentence</button>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div id="right">
    <p id="countdown"></p>
    <p id="output"></p>
    <p id="result"></p>
    <p id="score">Score: 0</p>
  </div>
</div>

<script>
/* ---------- SENTENCES ---------- */
const sentences=[
  {text:"I like apples",emoji:"🍎"},{text:"The dog is big",emoji:"🐕"},
  {text:"She has a book",emoji:"📖"},{text:"We play outside",emoji:"⚽"},
  {text:"It is rainy today",emoji:"🌧️"},
  {text:"Birds can fly",emoji:"🐦"},{text:"Fish swim fast",emoji:"🐠"},
  {text:"I see a rainbow",emoji:"🌈"},{text:"Cars go fast",emoji:"🚗"},
  {text:"Elephants are big",emoji:"🐘"},{text:"Stars shine bright",emoji:"⭐"}
];

/* ---------- STATE ---------- */
let current="",score=0,isListening=false;

/* ---------- HELPERS ---------- */
const $=q=>document.querySelector(q);
function say(txt,cb){
  const u=new SpeechSynthesisUtterance(txt),
        v=speechSynthesis.getVoices()
           .find(v=>/female|zira|joanna|en-gb/i.test(v.name))||speechSynthesis.getVoices()[0];
  if(v) u.voice=v; u.onend=()=>cb&&cb(); speechSynthesis.speak(u);
}

/* ---------- NEW SENTENCE ---------- */
function nextSentence(){
  const s=sentences[Math.random()*sentences.length|0];
  current=s.text;
  $("#sentence").innerText=current;
  $("#image").innerText=s.emoji;
  $("#countdown").innerText=$("#output").innerText=$("#result").innerText="";
  $("#result").className=""; $("#startBtn").disabled=false;
}

/* ---------- COUNTDOWN ---------- */
function startCountdown(){
  if(isListening) return;
  $("#startBtn").disabled=true;
  const nums=["3","2","1"]; let i=0;
  function next(){
    if(i<nums.length){
      $("#countdown").innerText=nums[i]; say(nums[i],()=>{i++;next();});
    }else{
      $("#countdown").innerText="🎤 Speak now!"; setTimeout(startListening,300);
    }
  } next();
}

/* ---------- LISTEN ---------- */
function startListening(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Speech Recognition not supported");$("#startBtn").disabled=false;return;}
  isListening=true;
  const rec=new SR(); rec.lang="en-US";
  rec.onstart=()=>$("#countdown").innerText="🎤 Listening…";
  rec.onresult=e=>{
    const spoken=e.results[0][0].transcript.trim().toLowerCase();
    $("#output").innerText=`You said: “${spoken}”`;
    if(spoken===current.toLowerCase()){
      $("#result").innerText="✅ Great job!";$("#result").className="good";
      score++; say("Great job! Click next sentence to continue!");
    }else{
      $("#result").innerText="❌ Please try again!";$("#result").className="bad";
      say("Please try again!");
    }
    $("#score").innerText="Score: "+score; finish();
  };
  rec.onerror=finish; rec.onend=finish; rec.start();
  function finish(){isListening=false;$("#startBtn").disabled=false;$("#countdown").innerText="";}
}

/* ---------- INIT ---------- */
window.onload=nextSentence;
</script>
</body>
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

	import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

	createChat({
		webhookUrl: 'YOUR_PRODUCTION_WEBHOOK_URL'
	});
</script>
</html>
